      - paragraph [ref=e518]: 我们很容易想到绝对值的性质,由此可以分类讨论
      - text: "f_1(x)>f_2(x)\\\\ f_1(x)\\ge 0 \\end{cases} \\quad\\text{或}\\quad \\begin{cases} -f_1(x)>f_2(x)\\\\ f_1(x)<0 \\end{cases}$$ ## 平方法 如果 $$\\forall x\\in D,\\quad f_2(x)\\geqslant 0$$ 可以将两边平方 $$\\left( f_1\\left( x \\right) \\right) ^2>\\left( f_2\\left( x \\right) \\right) ^2$$ 利用平方差公式,得 $$\\left( f_1\\left( x \\right) +f_2\\left( x \\right) \\right) \\left( f_1\\left( x \\right) -f_2\\left( x \\right) \\right) >0$$ 此时就变成一个一元多次不等式,一般借助图像法解决 ## 图像法 这是一种通用解法,比较暴力 直接画出 $y=|f_1(x)|$ 和 $y=f_2(x)$ 的函数图像 求一下交点就能轻松得到,不过有些费事 ## 根式不等式 对于$$\\sqrt{f_1\\left( x \\right)}>f_2\\left( x \\right) $$ 我们需要根据 $f_2(x)$ 的正负进行分类讨论 容易得到"
      - paragraph [ref=e519]: "\\sqrt{f_1(x)}>f_2(x) \\iff \\begin{cases} f_1(x)\\ge 0\\ f_2(x)<0 \\end{cases} \\quad\\text{或}\\quad \\begin{cases} f_1(x)>\\left(f_2(x)\\right)^2\\ f_2(x)\\ge 0 \\end{cases}"
